# alembic.ini — Alembic migration configuration for Firduty
# Placed in backend/ (the same directory as main.py).
#
# Usage:
#   cd backend/
#   alembic upgrade head          # apply all pending migrations
#   alembic revision --autogenerate -m "describe change"   # generate new migration
#   alembic downgrade -1          # roll back one migration
#   alembic history               # list applied migrations
#   alembic current               # show current DB revision

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# SQLAlchemy URL is read from the DATABASE_URL environment variable at runtime.
# See alembic/env.py for the dynamic URL injection.
# This placeholder is required by Alembic; it is overridden in env.py.
sqlalchemy.url = postgresql://placeholder

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S