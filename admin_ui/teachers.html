<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Teachers</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">
</head>
<body>
<header class="app-header">
  <h1><img src="logo.png" alt="Firduty" class="header-logo">Firduty</h1>
  <div class="header-actions">
    <button class="btn btn-lang btn-sm" onclick="I18N.toggle().then(()=>location.reload())">عربي | EN</button>
    <button class="btn btn-lang btn-sm" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<nav class="main-nav" id="mainNav" aria-label="Main navigation"></nav>

<main class="main-content teachers-page">
  <section class="teachers-hero">
    <div>
      <h2 class="teachers-title">Teachers</h2>
      <p class="teachers-subtitle">Review registrations and manage approvals with a mobile-friendly layout.</p>
    </div>
    <div class="teachers-hero-actions">
      <button class="btn btn-primary btn-sm" id="addTeacherBtn" type="button">+ Add New Teacher</button>
      <button class="btn btn-success btn-sm" id="approveAllBtn" type="button">Approve All Pending</button>
      <button class="btn btn-secondary btn-sm" id="refreshTeachersBtn" type="button">Refresh</button>
    </div>
  </section>

  <section class="teachers-stats-grid" aria-label="Teacher summary">
    <article class="teacher-stat-card">
      <span class="teacher-stat-label">Pending</span>
      <strong class="teacher-stat-value" id="summaryPendingValue">0</strong>
    </article>
    <article class="teacher-stat-card">
      <span class="teacher-stat-label">Approved</span>
      <strong class="teacher-stat-value" id="summaryApprovedValue">0</strong>
    </article>
    <article class="teacher-stat-card">
      <span class="teacher-stat-label">Active</span>
      <strong class="teacher-stat-value" id="summaryTotalValue">0</strong>
    </article>
  </section>

  <div id="alertMsg" class="alert" style="display:none"></div>

  <section class="teachers-panel">
    <div class="teachers-panel-toolbar">
      <div class="teachers-search-wrap">
        <input id="teacherSearchInput" class="teachers-search-input" type="search" placeholder="Search teachers..." autocomplete="off">
      </div>

      <div class="teachers-tabs" role="tablist" aria-label="Teacher views">
        <button class="tab-btn active" id="tabPending" type="button" role="tab" aria-selected="true">
          <span>Pending Approval</span>
          <span class="tab-count" id="pendingCount">0</span>
        </button>
        <button class="tab-btn" id="tabAll" type="button" role="tab" aria-selected="false">
          <span>All Teachers</span>
        </button>
      </div>
    </div>

    <div id="pendingSection" class="teachers-section">
      <div id="pendingLoading" class="table-loading"><div class="spinner"></div></div>
      <div id="pendingTableWrap"></div>
    </div>

    <div id="allSection" class="teachers-section" style="display:none">
      <div id="allLoading" class="table-loading"><div class="spinner"></div></div>
      <div id="allTableWrap"></div>
    </div>
  </section>
</main>

<div class="modal-backdrop" id="teacherModalBackdrop" aria-hidden="true">
  <div class="teacher-modal" role="dialog" aria-modal="true" aria-labelledby="teacherModalTitle">
    <div class="teacher-modal-header">
      <div>
        <h3 id="teacherModalTitle">Add Teacher</h3>
        <p id="teacherModalSubtitle">Create a teacher record directly from the admin dashboard.</p>
      </div>
      <button class="icon-btn" type="button" id="closeTeacherModalBtn" aria-label="Close">✕</button>
    </div>

    <div class="teacher-modal-body">
      <div class="form-field">
        <label for="teacherNameInput">Name</label>
        <input id="teacherNameInput" type="text" autocomplete="off">
      </div>

      <div class="form-field">
        <label for="teacherEmailInput">Email</label>
        <input id="teacherEmailInput" type="email" autocomplete="off">
      </div>

      <div class="form-grid-2">
        <div class="form-field">
          <label for="teacherLanguageInput">Language</label>
          <select id="teacherLanguageInput">
            <option value="ar">Arabic</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="form-field">
          <label for="teacherStatusInput">Status</label>
          <select id="teacherStatusInput">
            <option value="approved">Approved</option>
            <option value="pending">Pending</option>
          </select>
        </div>
      </div>

      <p class="form-error" id="teacherFormError"></p>
    </div>

    <div class="teacher-modal-footer">
      <button class="btn btn-secondary btn-sm" type="button" id="cancelTeacherModalBtn">Cancel</button>
      <button class="btn btn-primary btn-sm" type="button" id="saveTeacherModalBtn">Save Teacher</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="deleteTeacherBackdrop" aria-hidden="true">
  <div class="teacher-modal teacher-modal-sm" role="dialog" aria-modal="true" aria-labelledby="deleteTeacherTitle">
    <div class="teacher-modal-header">
      <div>
        <h3 id="deleteTeacherTitle">Remove Teacher</h3>
        <p>This will deactivate the teacher and remove them from active lists.</p>
      </div>
      <button class="icon-btn" type="button" id="closeDeleteModalBtn" aria-label="Close">✕</button>
    </div>

    <div class="teacher-modal-body">
      <div class="delete-warning">
        <strong id="deleteTeacherName">Teacher</strong>
        <p id="deleteTeacherEmail">—</p>
      </div>
      <p class="form-error" id="deleteTeacherError"></p>
    </div>

    <div class="teacher-modal-footer">
      <button class="btn btn-secondary btn-sm" type="button" id="cancelDeleteTeacherBtn">Cancel</button>
      <button class="btn btn-danger btn-sm" type="button" id="confirmDeleteTeacherBtn">Remove</button>
    </div>
  </div>
</div>

<script src="js/auth.js?v=110"></script>
<script src="js/i18n.js?v=110"></script>
<script src="js/nav.js?v=110"></script>
<script src="js/teachers.js?v=110"></script>
<script>
  I18N.load(localStorage.getItem('firduty_lang') || 'ar').then(() => {
    initNav();
  });
</script>
</body>
</html>
