<!-- toolbar -->

<div class="teachers-toolbar">

  <button class="btn btn-success btn-sm" onclick="openAddTeacherModal()">
    + Add New Teacher
  </button>

  <button class="btn btn-success btn-sm" onclick="approveAll()">
    Approve All Pending
  </button>

  <button class="btn btn-secondary btn-sm" onclick="exportTeachersCSV()">
    Export CSV
  </button>

  <button class="btn btn-secondary btn-sm" onclick="loadAll()">
    Refresh
  </button>

</div>


<div class="search-bar">

<input
id="teacherSearch"
placeholder="Search teachers..."
oninput="filterTeachers()"
/>

</div>


<table class="teacher-table">

<thead>
<tr>

<th>
<input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
</th>

<th>#</th>
<th>Name</th>
<th>Email</th>
<th>Status</th>
<th>Language</th>
<th>Date</th>
<th>Actions</th>

</tr>
</thead>

<tbody id="teachersTable"></tbody>

</table>


<div class="bulk-actions">

<button class="btn btn-danger btn-sm" onclick="bulkDeleteTeachers()">
Delete Selected
</button>

</div>
