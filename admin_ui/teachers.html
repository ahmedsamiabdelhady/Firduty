<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Teachers</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">

  <style>
    .teachers-page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .teachers-page-head h2 {
      margin: 0;
      color: var(--text);
      font-size: 1.15rem;
    }
    .teachers-page-subtitle {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .teachers-toolbar-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      border-bottom: none;
      flex-wrap: wrap;
    }
    .tab-btn {
      border: 1px solid var(--border);
      background: var(--white);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--text);
      font-weight: 700;
      margin-bottom: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn.active {
      background: var(--nav);
      color: var(--white);
      border-color: var(--nav);
    }
    .tab-badge {
      min-width: 22px;
      height: 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      font-size: 0.76rem;
      font-weight: 800;
      background: rgba(255,255,255,0.18);
    }
    .tab-btn:not(.active) .tab-badge {
      background: #eef6fb;
      color: var(--nav);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .badge-pending  { background: #fff3cd; color: #856404; }
    .badge-approved { background: #d1e7dd; color: #0a5c36; }
    .teachers-table-wrap {
      min-height: 180px;
    }
    .teacher-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      overflow: hidden;
    }
    .teacher-table th {
      background: var(--nav);
      color: var(--white);
      padding: 12px 14px;
      text-align: start;
      font-size: 0.84rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .teacher-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      vertical-align: middle;
    }
    .teacher-table tr:last-child td {
      border-bottom: none;
    }
    .teacher-table tr:hover td {
      background: #f8fbfd;
    }
    .teacher-name-cell strong {
      color: var(--text);
      font-size: 0.95rem;
    }
    .teacher-actions-cell {
      white-space: nowrap;
    }
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1><img src="logo.png" alt="Firduty" class="header-logo">Firduty</h1>
  <div class="header-actions">
    <button class="btn btn-lang btn-sm" onclick="I18N.toggle().then(()=>location.reload())">عربي | EN</button>
    <button class="btn btn-lang btn-sm" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<nav class="main-nav" id="mainNav" aria-label="Main navigation"></nav>

<main class="main-content">
  <div class="teachers-page-head">
    <div>
      <h2 data-i18n="teacher_approval">Teachers</h2>
      <p class="teachers-page-subtitle">Review registrations and manage approvals with a mobile-friendly layout.</p>
    </div>
  </div>

  <div class="teachers-stats-grid" aria-label="Teacher statistics">
    <div class="teachers-stat-card">
      <div class="teachers-stat-label">Pending</div>
      <div class="teachers-stat-value" id="statPending">0</div>
    </div>
    <div class="teachers-stat-card">
      <div class="teachers-stat-label">Approved</div>
      <div class="teachers-stat-value" id="statApproved">0</div>
    </div>
    <div class="teachers-stat-card">
      <div class="teachers-stat-label">Active</div>
      <div class="teachers-stat-value" id="statActive">0</div>
    </div>
  </div>

  <div class="teachers-toolbar-card">
    <div class="teachers-actions-row">
      <div class="teachers-actions-group">
        <button class="btn btn-success btn-sm" id="approveAllBtn" onclick="approveAll()" data-i18n="approve_all">Approve All Pending</button>
        <button class="btn btn-secondary btn-sm" id="refreshTeachersBtn" onclick="loadAll()" data-i18n="refresh">Refresh</button>
      </div>
    </div>

    <div class="teachers-search-bar">
      <input type="search" id="teacherSearchInput" placeholder="Search teachers..." autocomplete="off">
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabPending" type="button" onclick="showTab('pending')">
        <span data-i18n="tab_pending">Pending Approval</span>
        <span class="tab-badge" id="pendingCount">0</span>
      </button>
      <button class="tab-btn" id="tabAll" type="button" onclick="showTab('all')">
        <span data-i18n="tab_all_teachers">All Teachers</span>
      </button>
    </div>

    <div id="alertMsg" class="alert" style="display:none;margin-bottom:16px"></div>

    <section id="pendingSection">
      <div id="pendingLoading" style="text-align:center;padding:32px"><div class="spinner"></div></div>
      <div class="teachers-table-wrap" id="pendingTableWrap"></div>
    </section>

    <section id="allSection" style="display:none">
      <div id="allLoading" style="text-align:center;padding:32px"><div class="spinner"></div></div>
      <div class="teachers-table-wrap" id="allTableWrap"></div>
    </section>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script src="js/auth.js?v=101"></script>
<script src="js/i18n.js?v=101"></script>
<script src="js/nav.js?v=101"></script>
<script src="js/teachers.js?v=110"></script>
<script>
  I18N.load(localStorage.getItem('firduty_lang') || 'ar').then(() => {
    initNav();
  });
</script>
</body>
</html>
