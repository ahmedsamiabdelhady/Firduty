<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Teachers</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">
  <style>
    .teachers-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .teachers-toolbar h2 { flex: 1; font-size: 1.1rem; color: var(--text); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
    .badge-pending  { background: #fff3cd; color: #856404; }
    .badge-approved { background: #d1e7dd; color: #0a5c36; }
    .teacher-table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .teacher-table th { background: var(--primary); color: var(--white); padding: 12px 16px; text-align: start; font-weight: 600; font-size: 0.85rem; }
    .teacher-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: middle; }
    .teacher-table tr:last-child td { border-bottom: none; }
    .teacher-table tr:hover td { background: #f8f9fa; }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
  </style>
</head>
<body>

<header class="app-header">
  <h1>Firduty</h1>
  <div class="header-actions">
    <button class="btn btn-lang btn-sm" onclick="I18N.toggle().then(()=>location.reload())">عربي | EN</button>
    <button class="btn btn-lang btn-sm" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<nav class="main-nav" id="mainNav" aria-label="Main navigation"></nav>

<main class="main-content">

  <div class="teachers-toolbar">
    <h2 data-i18n="teacher_approval">Teachers</h2>
    <button class="btn btn-success btn-sm" id="approveAllBtn" onclick="approveAll()" data-i18n="approve_all">Approve All Pending</button>
    <button class="btn btn-secondary btn-sm" onclick="loadAll()" data-i18n="refresh">Refresh</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabPending" onclick="showTab('pending')">
      <span data-i18n="tab_pending">Pending Approval</span>
      <span id="pendingCount" style="display:none"></span>
    </button>
    <button class="tab-btn" id="tabAll" onclick="showTab('all')">
      <span data-i18n="tab_all_teachers">All Teachers</span>
    </button>
  </div>

  <div id="alertMsg" class="alert" style="display:none;margin-bottom:16px"></div>

  <div id="pendingSection">
    <div id="pendingLoading" style="text-align:center;padding:32px"><div class="spinner"></div></div>
    <div id="pendingTableWrap"></div>
  </div>

  <div id="allSection" style="display:none">
    <div id="allLoading" style="text-align:center;padding:32px"><div class="spinner"></div></div>
    <div id="allTableWrap"></div>
  </div>

</main>

<div class="toast-container" id="toastContainer"></div>

<script src="js/auth.js?v=101"></script>
<script src="js/i18n.js?v=101"></script>
<script src="js/nav.js?v=101"></script>
<script src="js/teachers.js?v=101"></script>
<script>
  I18N.load(localStorage.getItem('firduty_lang') || 'ar').then(() => {
    initNav();
  });
</script>
</body>
</html>
