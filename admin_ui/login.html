<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon"    href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">
</head>
<body>

<div class="login-wrapper">
  <div class="login-split">

    <!-- ── Brand panel (left on desktop, top on mobile) ──────────────────── -->
    <div class="login-brand">
      <img src="logo.png" alt="Firduty" class="login-brand-logo">
      <h1>Firduty</h1>
      <p>Plan duties, approve teachers, and monitor weekly operations from one admin workspace.</p>
      <ul class="login-brand-features">
        <li><span>📅</span><span>Build and publish weekly duty schedules</span></li>
        <li><span>👩‍🏫</span><span>Approve teacher registrations instantly</span></li>
        <li><span>📊</span><span>Track points and duty confirmations</span></li>
      </ul>
    </div>

    <!-- ── Form panel (right on desktop, bottom on mobile) ──────────────── -->
    <div class="login-form-panel">

      <!-- Language toggle -->
      <div class="login-lang-row">
        <button class="login-lang-btn" id="langToggle" onclick="toggleLang()">عربي | EN</button>
      </div>

      <div class="login-form-header">
        <h2 data-i18n="sign_in">Welcome back</h2>
        <p>Sign in to continue to the Firduty admin dashboard.</p>
      </div>

      <!-- Error message -->
      <div id="loginError" class="login-error" role="alert"></div>

      <!-- Username -->
      <div class="form-group">
        <label for="username" data-i18n="username">Username</label>
        <input
          type="text"
          id="username"
          autocomplete="username"
          data-i18n-placeholder="username"
          placeholder="Username"
          onkeydown="if(event.key==='Enter')document.getElementById('password').focus()"
        >
      </div>

      <!-- Password with eye toggle -->
      <div class="form-group">
        <label for="password" data-i18n="password">Password</label>
        <div class="login-input-wrap">
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            data-i18n-placeholder="password"
            placeholder="Password"
            onkeydown="if(event.key==='Enter')doLogin()"
          >
          <button class="login-eye-btn" type="button" onclick="togglePassword()" id="eyeBtn" aria-label="Show password">
            👁
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button class="login-submit-btn" id="loginBtn" onclick="doLogin()">
        <span data-i18n="sign_in">Sign In</span>
      </button>

    </div><!-- /.login-form-panel -->
  </div><!-- /.login-split -->
</div><!-- /.login-wrapper -->

<script src="js/i18n.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/login.js?v=3"></script>
</body>
</html>
