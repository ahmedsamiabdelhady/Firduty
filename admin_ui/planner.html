<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Week Planner</title>
  <!-- Single CSS link (was duplicated in previous version) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon"    href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">
  <!-- SortableJS — desktop drag-and-drop only; never used on mobile -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

  <style>
    /* ── Busy overlay ───────────────────────────────────────────────── */
    .planner-main { position: relative; }

    .planner-busy-overlay {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      z-index: 30;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(1px);
      border-radius: 16px;
    }
    .planner-busy-card {
      min-width: 280px; max-width: 420px;
      width: min(90%, 420px);
      background: #fff; border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15,23,42,0.14);
      padding: 20px 22px; text-align: center;
    }
    .planner-busy-title {
      font-size: 1rem; font-weight: 700; color: #1f2937; margin-bottom: 12px;
    }
    .planner-progress {
      height: 10px; width: 100%;
      background: #e5e7eb; border-radius: 999px; overflow: hidden; position: relative;
    }
    .planner-progress-bar {
      height: 100%; width: 35%;
      border-radius: 999px;
      background: linear-gradient(90deg, #60a5fa, #2563eb);
      transform: translateX(-120%);
    }
    .planner-progress-bar.is-active {
      animation: plannerBusySlide 1.1s ease-in-out infinite;
    }
    @keyframes plannerBusySlide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(320%);  }
    }

    /* ── Sidebar search ─────────────────────────────────────────────── */
    .teacher-search-wrap {
      margin-bottom: 10px;
    }
    .teacher-search-input {
      width: 100%;
      padding: 7px 10px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      outline: none;
      box-sizing: border-box;
    }
    .teacher-search-input:focus {
      border-color: var(--nav-light);
      box-shadow: 0 0 0 2px rgba(79,161,204,0.2);
    }
    .sidebar-empty {
      font-size: 0.8rem; color: #999; text-align: center; padding: 12px 0;
    }

    /* ── Day / shift styles ──────────────────────────────────────────── */
    .day-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
      margin-bottom: 12px;
      padding: 10px 14px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .day-header-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .day-header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .day-date { font-weight: 600; font-size: 0.9rem; color: var(--nav); }

    .day-badge {
      font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; font-weight: 600;
    }
    .day-badge--editable { background: #dcfce7; color: #15803d; }
    .day-badge--locked   { background: #fee2e2; color: #991b1b; }
    .published-badge     { font-size: 0.8rem; color: #166534; background: #dcfce7; padding: 6px 10px; border-radius: 999px; }

    .shift-tabs {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
    }
    .shift-tab-btn {
      padding: 6px 14px; border-radius: var(--radius);
      background: var(--bg); border: 1px solid var(--border);
      cursor: pointer; font-size: 0.83rem; color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .shift-tab-btn.active {
      background: var(--nav); color: #fff; border-color: var(--nav);
    }
    .break-badge {
      font-size: 0.7rem; background: #ede9fe; color: #5b21b6;
      border-radius: 8px; padding: 1px 7px; margin-inline-start: 6px;
    }
    .break-col-title { color: #7c3aed; font-weight: 600; }

    .locations-grid {
      display: flex; flex-wrap: wrap; gap: 14px;
    }
    .location-column {
      flex: 1 1 220px; min-width: 180px; max-width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
    }
    .location-column-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .loc-title { font-size: 0.85rem; font-weight: 600; color: var(--nav); }

    .slot-controls {
      display: flex; align-items: center; gap: 4px; font-size: 0.8rem;
    }

    .slot-empty-label { color: #bbb; font-size: 0.8rem; }

    /* ── Desktop drag-over visual feedback (not shown on mobile) ──────────
       .slot-drag-add     = green solid box  → teacher will be ADDED
       .slot-drag-replace = red  solid box   → teacher will REPLACE existing
    ────────────────────────────────────────────────────────────────────── */
    @media (min-width: 769px) {
      .slot-drag-add {
        outline: 3px solid #22c55e !important;
        background: #f0fdf4 !important;
        box-shadow: 0 0 0 6px rgba(34,197,94,0.12) !important;
        transition: none !important;
      }
      .slot-drag-replace {
        outline: 3px solid #ef4444 !important;
        background: #fef2f2 !important;
        box-shadow: 0 0 0 6px rgba(239,68,68,0.12) !important;
        transition: none !important;
      }
    }

    /* ── Hide Sortable's ghost in slot lists — prevents reorder illusion ── */
    .slots-list .sortable-ghost {
      opacity: 0 !important;
      height: 0 !important;
      min-height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      overflow: hidden !important;
      pointer-events: none !important;
    }
    /* Break grid: ghost must be removed from grid flow entirely so it
       doesn't push other cells sideways during a drag */
    .break-grid .sortable-ghost {
      display: none !important;
    }
    /* Dim sidebar item while it's being dragged */
    .teacher-list .sortable-chosen { opacity: 0.5; }

    /* Mobile: slots are tappable */
    @media (max-width: 768px) {
      /* ── Hide teacher sidebar on mobile (assignment via bottom-sheet) ── */
      .sidebar { display: none !important; }

      .slot-item {
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(46,125,167,0.15);
        min-height: 48px;
      }
      .slot-item:active { opacity: 0.72; transform: scale(0.98); }

      /* Empty slot: "— tap to assign" hint */
      .slot-item:not(.filled) .slot-empty-label::after {
        content: ' — tap to assign';
        color: var(--nav-light);
        font-size: 0.72rem;
      }

      /* Filled slot: small "tap to replace" subtext below teacher name */
      .slot-item.filled .teacher-card::after {
        content: 'tap to replace';
        display: block;
        font-size: 0.65rem;
        opacity: 0.55;
        font-weight: 400;
        margin-top: 2px;
        font-style: italic;
      }

      .locations-grid { flex-direction: column; }
      .location-column { max-width: 100%; }
    }

    /* ── Mobile bottom-sheet teacher picker ──────────────────────────── */
    .mobile-bottom-sheet {
      position: fixed; inset: 0;
      display: none; /* shown via JS */
      flex-direction: column;
      z-index: 500;
    }
    .bottom-sheet-backdrop {
      flex: 1;
      background: rgba(0,0,0,0.4);
    }
    .bottom-sheet-panel {
      background: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
      max-height: 72vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .bottom-sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 10px;
      border-bottom: 1px solid var(--border);
    }
    .bottom-sheet-title {
      font-size: 1rem; font-weight: 700; color: var(--text);
    }
    .bottom-sheet-close {
      background: none; border: none; cursor: pointer;
      font-size: 1.3rem; color: var(--text-muted); line-height: 1;
      padding: 4px 8px; border-radius: 6px;
    }
    .bottom-sheet-close:hover { background: var(--bg); }
    .bottom-sheet-search {
      margin: 10px 16px;
      padding: 9px 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 0.9rem; outline: none;
      flex-shrink: 0;
    }
    .bottom-sheet-search:focus { border-color: var(--nav-light); }
    .bottom-sheet-list {
      overflow-y: auto;
      padding: 4px 16px 24px;
      flex: 1;
    }
    .bottom-sheet-teacher-btn {
      display: block; width: 100%;
      padding: 12px 14px;
      margin-bottom: 6px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer; text-align: start;
      font-size: 0.9rem; color: var(--text);
      transition: background 0.12s;
    }
    .bottom-sheet-teacher-btn:hover,
    .bottom-sheet-teacher-btn:active { background: var(--slot-filled); }
    .bottom-sheet-empty {
      font-size: 0.85rem; color: #999; text-align: center; padding: 20px 0;
    }

    /* ── Week status badge ───────────────────────────────────────────── */
    .week-status-badge {
      display: inline-block; padding: 3px 12px;
      border-radius: 999px; font-size: 0.78rem; font-weight: 700;
    }
    .week-status-badge.status-draft     { background: #fef9c3; color: #854d0e; }
    .week-status-badge.status-published { background: #dcfce7; color: #166534; }

    /* ── Shift time editor bar ───────────────────────────────────────── */
    .shift-time-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 12px;
      padding: 6px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .shift-time-display { font-weight: 600; color: var(--nav); }
    .btn-time-edit {
      background: none; border: none; cursor: pointer;
      font-size: 0.88rem; padding: 2px 6px;
      border-radius: 4px; color: var(--text-muted);
      transition: background 0.12s;
    }
    .btn-time-edit:hover { background: var(--border); color: var(--nav); }
    .shift-time-edit-form {
      display: none; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .shift-time-in {
      padding: 4px 8px; border: 1.5px solid var(--border);
      border-radius: var(--radius); font-size: 0.82rem; font-family: inherit;
      background: var(--white);
    }
    .shift-time-in:focus { outline: none; border-color: var(--nav-light); }
    .btn-xs {
      padding: 3px 10px; font-size: 0.78rem; border-radius: var(--radius);
      cursor: pointer; border: 1px solid transparent; font-family: inherit;
    }
    .btn-xs.btn-primary   { background: var(--nav); color: #fff; border-color: var(--nav); }
    .btn-xs.btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border); }
    .shift-time-edit-msg { font-size: 0.75rem; color: var(--text-muted); font-style: italic; }

    /* ── Break duty grid ─────────────────────────────────────────────── */
    /* The break "column" takes the full width of the locations-grid */
    .location-column.break-location-column {
      flex: 0 0 100%;
      max-width: 100%;
      min-width: unset;
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
    }
    /* Responsive grid of break cells */
    .break-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }
    /* Individual break cell (slot-item with additional break styling) */
    .slot-item.break-cell {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 80px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--white, #fff);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .slot-item.break-cell:hover {
      border-color: var(--nav-light);
      background: #f8faff;
    }
    .slot-item.break-cell.filled {
      border-color: #a7f3d0;
      background: #f0fdf4;
    }
    /* Drag-over highlight for break cells — override base colors */
    @media (min-width: 769px) {
      .slot-item.break-cell.slot-drag-add {
        outline: 3px solid #22c55e !important;
        background: #f0fdf4 !important;
      }
      .slot-item.break-cell.slot-drag-replace {
        outline: 3px solid #ef4444 !important;
        background: #fef2f2 !important;
      }
    }
    /* Grade class badge inside break cell */
    .break-cell-grade {
      display: inline-block;
      font-size: 0.72rem; font-weight: 700;
      color: #5b21b6; background: #ede9fe;
      padding: 2px 8px; border-radius: 6px;
      text-align: center; align-self: flex-start;
      white-space: nowrap;
    }
    /* Teacher chip inside break cell */
    .break-cell .teacher-card {
      font-size: 0.82rem;
    }
    /* Empty label inside break cell */
    .break-cell .slot-empty-label {
      font-size: 0.78rem; color: #bbb;
      flex: 1;
    }
    /* Mobile tap hint on break cells */
    @media (max-width: 768px) {
      .slot-item.break-cell:not(.filled) .slot-empty-label::after {
        content: ' — tap';
        color: var(--nav-light);
        font-size: 0.68rem;
      }
    }
    /* ── Notify-scope modal ──────────────────────────────────────────── */
    .notify-scope-overlay {
      position: fixed; inset: 0; z-index: 600;
      background: rgba(15,23,42,0.45);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.18s ease;
      padding: 16px;
    }
    .notify-scope-overlay.notify-scope-visible { opacity: 1; }

    .notify-scope-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 16px 48px rgba(15,23,42,0.22);
      padding: 28px 26px 22px;
      max-width: 420px; width: 100%;
      transform: translateY(12px);
      transition: transform 0.2s cubic-bezier(0.34,1.2,0.64,1);
    }
    .notify-scope-overlay.notify-scope-visible .notify-scope-card {
      transform: translateY(0);
    }
    .notify-scope-title {
      font-size: 1.05rem; font-weight: 700; color: var(--nav);
      margin: 0 0 6px;
    }
    .notify-scope-sub {
      font-size: 0.84rem; color: var(--text-muted); margin: 0 0 18px;
    }
    .notify-scope-options { display: flex; flex-direction: column; gap: 8px; }

    .nsbtn {
      display: block; width: 100%;
      padding: 11px 16px;
      border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text);
      font-size: 0.88rem; font-family: inherit; font-weight: 500;
      text-align: start; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      line-height: 1.45;
    }
    .nsbtn:hover:not(:disabled) { background: var(--surface); border-color: var(--nav-light); }
    .nsbtn:disabled { opacity: 0.45; cursor: not-allowed; }

    .nsbtn--all      { border-color: #93c5fd; }
    .nsbtn--all:hover:not(:disabled) { background: #eff6ff; border-color: #3b82f6; }
    .nsbtn--affected { border-color: #86efac; }
    .nsbtn--affected:hover:not(:disabled) { background: #f0fdf4; border-color: #22c55e; }
    .nsbtn--none     { border-color: #fca5a5; }
    .nsbtn--none:hover:not(:disabled) { background: #fef2f2; border-color: #ef4444; }
    .nsbtn--cancel   {
      background: none; border-color: transparent; color: var(--text-muted);
      font-weight: 400; font-size: 0.82rem;
    }
    .nsbtn--cancel:hover { background: var(--bg); }
  </style>
</head>
<body>

<!-- Guard runs immediately; redirects to login.html if no token -->
<script>
  // Inline guard: i18n.js / auth.js are loaded below, but we need the token
  // check as early as possible to avoid rendering the page for unauthenticated users.
  (function () {
    if (!localStorage.getItem('firduty_token')) {
      window.location.replace('login.html');
    }
  })();
</script>

<header class="app-header">
  <h1>
    <img src="logo.png" alt="Firduty logo" width="32" height="32">
    <span data-i18n="app_title">Firduty</span>
  </h1>
  <div class="header-actions">
    <button class="btn btn-lang btn-sm"
            data-lang-toggle
            onclick="I18N.toggle().then(()=>location.reload())">عربي | EN</button>
    <button class="btn btn-lang btn-sm" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<main class="main-content">

  <!-- Navigation -->
  <nav class="nav-bar">
    <a class="nav-btn"        href="dashboard.html" data-i18n="dashboard">Dashboard</a>
    <a class="nav-btn active" href="planner.html"   data-i18n="week_planner">Weekly Planner</a>
    <a class="nav-btn"        href="reports.html"   data-i18n="monthly_report">Monthly Points Report</a>
    <a class="nav-btn"        href="teachers.html"  data-i18n="teacher_approval">Teachers</a>
    <a class="nav-btn"        href="shifts.html"    data-i18n="shift_management">Shifts Management</a>
  </nav>

  <!-- Week Controls -->
  <div class="week-controls">
    <label for="weekStartInput" data-i18n="select_week">Select Week:</label>
    <input type="date" id="weekStartInput" onchange="onWeekSelected()">
    <button class="btn btn-primary btn-sm" onclick="loadWeek()" data-i18n="load_week">Load Week</button>

    <span id="weekStatusBadge" class="week-status-badge" style="display:none"></span>
    <span id="weekVersionBadge" style="font-size:0.8rem;color:#6c757d"></span>

    <div style="margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="createWeek()" data-i18n="create_week">Create Week</button>
      <button class="btn btn-secondary btn-sm" onclick="cloneWeek()"  data-i18n="clone_last_week">Clone from Last Week</button>
      <button class="btn btn-warning  btn-sm" onclick="saveDraft()"   data-i18n="save_draft">Save Draft</button>
      <button class="btn btn-success  btn-sm" onclick="publishWeek()" data-i18n="publish_week">Publish Week</button>
    </div>
  </div>

  <!-- Planner Layout -->
  <div class="planner-layout">

    <!-- Teacher Sidebar -->
    <aside class="sidebar">
      <h3 data-i18n="teachers">Teachers</h3>

      <!-- Search (desktop filter + mobile reference) -->
      <div class="teacher-search-wrap">
        <input
          type="search"
          id="teacherSearch"
          class="teacher-search-input"
          data-i18n-placeholder="search_teachers"
          placeholder="Search teachers…"
          autocomplete="off"
          oninput="filterTeacherSidebar(this.value)"
        >
      </div>

      <div id="teachersLoading" style="text-align:center;padding:24px;display:none">
        <div class="spinner"></div>
      </div>

      <div class="teacher-list" id="teacherList"></div>
    </aside>

    <!-- Planner Main -->
    <div class="planner-main">

      <!-- Initial load spinner -->
      <div id="plannerLoading" style="text-align:center;padding:32px">
        <div class="spinner"></div>
      </div>

      <!-- Busy overlay (save / clone / create) -->
      <div id="plannerBusyOverlay" class="planner-busy-overlay"
           aria-live="polite" aria-busy="true" style="display:none">
        <div class="planner-busy-card">
          <div id="plannerLoadingText" class="planner-busy-title">Loading…</div>
          <div class="planner-progress">
            <div id="plannerLoadingBar" class="planner-progress-bar"></div>
          </div>
        </div>
      </div>

      <!-- Day tabs -->
      <div class="tabs" id="dayTabs"></div>

      <!-- Day panels + no-plan message -->
      <div id="dayPanels">
        <p id="noPlanMsg"
           style="color:#6c757d;text-align:center;margin-top:40px;display:none"
           data-i18n="no_week">
          No plan found for this week.
        </p>
      </div>

    </div><!-- /.planner-main -->

  </div><!-- /.planner-layout -->

</main>

<!-- Bottom-sheet is injected by JS (ensureMobileBottomSheet in planner.js) -->

<div class="toast-container" id="toastContainer"></div>

<script src="js/i18n.js?v=100"></script>
<script src="js/auth.js?v=100"></script>
<script src="js/planner.js?v=100"></script>
</body>
</html>
