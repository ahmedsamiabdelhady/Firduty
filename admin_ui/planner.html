<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Week Planner</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>@keyframes plannerProgress{0%{transform:translateX(-120%)}50%{transform:translateX(130%)}100%{transform:translateX(-120%)}}</style>
</head>
<body>

<header class="app-header">
  <h1 data-i18n="app_title">Firduty</h1>
  <div class="header-actions">
    <button class="btn btn-lang btn-sm" onclick="I18N.toggle().then(()=>location.reload())">عربي | EN</button>
    <button class="btn btn-lang btn-sm" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<main class="main-content">

  <!-- Navigation -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    <a href="dashboard.html" class="btn btn-secondary btn-sm" data-i18n="dashboard">Dashboard</a>
    <a href="planner.html" class="btn btn-primary btn-sm" data-i18n="week_planner">Week Planner</a>
    <a href="reports.html" class="btn btn-secondary btn-sm" data-i18n="monthly_report">Report</a>
  </div>

  <!-- Week Controls -->
  <div class="week-controls">
    <label data-i18n="select_week">Select Week:</label>
    <input type="date" id="weekStartInput" onchange="onWeekSelected()">
    <button class="btn btn-primary btn-sm" onclick="loadWeek()" data-i18n="load_week">Load</button>

    <span id="weekStatusBadge" class="week-status-badge" style="display:none"></span>
    <span id="weekVersionBadge" style="font-size:0.8rem;color:#6c757d"></span>

    <div style="margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="createWeek()" data-i18n="create_week">Create Week</button>
      <button class="btn btn-secondary btn-sm" onclick="cloneWeek()" data-i18n="clone_last_week">Clone</button>
      <button class="btn btn-warning btn-sm" onclick="saveDraft()" data-i18n="save_draft">Save Draft</button>
      <button class="btn btn-success btn-sm" onclick="publishWeek()" data-i18n="publish_week">Publish</button>
    </div>
  </div>

  <!-- Planner Layout -->
  <div class="planner-layout">

    <aside class="sidebar">
      <h3 data-i18n="teachers">Teachers</h3>

      <div id="teachersLoading" style="text-align:center;padding:24px">
        <div class="spinner"></div>
      </div>

      <div class="teacher-list" id="teacherList"></div>
    </aside>

    <div class="planner-main" style="position:relative">
      <div id="plannerLoading" style="display:none;position:absolute;inset:0;z-index:30;background:rgba(255,255,255,0.92);backdrop-filter:blur(1px);align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:32px;border-radius:16px">
        <div class="spinner"></div>
        <div id="plannerLoadingText" style="font-weight:600;color:#1f2937">Loading...</div>
        <div style="width:min(340px,90%);height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden">
          <div id="plannerLoadingBar" style="width:45%;height:100%;background:linear-gradient(90deg,#f59e0b,#22c55e);border-radius:999px;animation:plannerProgress 1.1s ease-in-out infinite"></div>
        </div>
      </div>

      <div class="tabs" id="dayTabs"></div>

      <div id="dayPanels">
        <p
          style="color:#6c757d;text-align:center;margin-top:40px;display:none"
          id="noPlanMsg"
          data-i18n="no_week"
        >
          No plan found for this week.
        </p>
      </div>
    </div>

  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script src="js/i18n.js?v=4"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/planner.js?v=4"></script>
</body>
</html>
