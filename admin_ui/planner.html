<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Week Planner</title>

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">

  <link rel="stylesheet" href="css/style.css">

  <!-- SortableJS for drag-and-drop -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

  <style>
    /* ── Planner busy overlay ─────────────────────────────────────────── */
    .planner-main { position: relative; }

    .planner-busy-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(1px);
      border-radius: 16px;
    }
    .planner-busy-card {
      min-width: 280px;
      max-width: 420px;
      width: min(90%, 420px);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15,23,42,0.14);
      padding: 20px 22px;
      text-align: center;
    }
    .planner-busy-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 12px;
    }
    .planner-progress {
      height: 10px;
      width: 100%;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .planner-progress-bar {
      height: 100%;
      width: 35%;
      border-radius: 999px;
      background: linear-gradient(90deg, #60a5fa, #2563eb);
      transform: translateX(-120%);
    }
    .planner-progress-bar.is-active {
      animation: plannerBusySlide 1.1s ease-in-out infinite;
    }
    @keyframes plannerBusySlide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1><img src="logo.png" alt="Firduty" class="header-logo">Firduty</h1>
  <div class="header-actions">
    <button class="btn btn-lang btn-sm" onclick="I18N.toggle().then(()=>location.reload())">عربي | EN</button>
    <button class="btn btn-lang btn-sm" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<nav class="main-nav" id="mainNav" aria-label="Main navigation"></nav>

<main class="main-content">



  <!-- Week Controls -->
  <div class="week-controls">
    <label data-i18n="select_week">Select Week:</label>
    <input type="date" id="weekStartInput" onchange="onWeekSelected ? onWeekSelected() : loadWeek()">
    <button class="btn btn-primary btn-sm" onclick="loadWeek()" data-i18n="load_week">Load</button>

    <span id="weekStatusBadge" class="week-status-badge" style="display:none"></span>
    <span id="weekVersionBadge" style="font-size:0.8rem;color:#6c757d"></span>

    <div style="margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="createWeek()"  data-i18n="create_week">Create Week</button>
      <button class="btn btn-secondary btn-sm" onclick="cloneWeek()"   data-i18n="clone_last_week">Clone</button>
      <button class="btn btn-warning   btn-sm" onclick="saveDraft()"   data-i18n="save_draft">Save Draft</button>
      <button class="btn btn-success   btn-sm" onclick="publishWeek()" data-i18n="publish_week">Publish</button>
    </div>
  </div>

  <!-- Planner Layout -->
  <div class="planner-layout">

    <aside class="sidebar" id="teachersSidebar">
      <div class="teacher-panel-header">
        <div>
          <h3 data-i18n="teachers">Teachers</h3>
          <p class="teacher-panel-subtitle" id="teacherPanelSubtitle">Search and drag teachers into slots.</p>
        </div>
      </div>
      <div class="teacher-search-wrap">
        <input type="search" id="teacherSearchInput" class="teacher-search-input" placeholder="Search teachers..." autocomplete="off">
      </div>
      <div id="teachersLoading" style="text-align:center;padding:24px">
        <div class="spinner"></div>
      </div>
      <div class="teacher-list" id="teacherList"></div>
    </aside>

    <div class="planner-main">
      <div id="plannerLoading" style="text-align:center;padding:32px">
        <div class="spinner"></div>
      </div>

      <div id="plannerBusyOverlay" class="planner-busy-overlay" aria-live="polite" aria-busy="true">
        <div class="planner-busy-card">
          <div id="plannerLoadingText" class="planner-busy-title">Loading...</div>
          <div class="planner-progress">
            <div id="plannerLoadingBar" class="planner-progress-bar"></div>
          </div>
        </div>
      </div>

      <div class="tabs" id="dayTabs"></div>

      <div id="dayPanels">
        <p style="color:#6c757d;text-align:center;margin-top:40px;display:none"
           id="noPlanMsg"
           data-i18n="no_week">
          No plan found for this week.
        </p>
      </div>
    </div>

  </div>
</main>

<button class="mobile-teacher-toggle" id="mobileTeacherToggle" type="button" aria-expanded="false">
  <span class="mobile-teacher-toggle-label" id="mobileTeacherToggleLabel">Teachers</span>
  <span class="mobile-teacher-toggle-count" id="mobileTeacherCount">0</span>
</button>

<div class="mobile-teacher-sheet" id="mobileTeacherSheet" aria-hidden="true">
  <div class="mobile-teacher-sheet-handle"></div>
  <div class="mobile-teacher-sheet-header">
    <div>
      <h3 data-i18n="teachers">Teachers</h3>
      <p class="mobile-teacher-sheet-subtitle" id="mobileTeacherSheetSubtitle">Tap a teacher, then tap a slot.</p>
    </div>
    <button class="btn btn-secondary btn-sm" id="mobileTeacherClose" type="button">Close</button>
  </div>
  <div class="teacher-search-wrap mobile-teacher-search-wrap">
    <input type="search" id="mobileTeacherSearchInput" class="teacher-search-input" placeholder="Search teachers..." autocomplete="off">
  </div>
  <div class="mobile-selected-hint" id="mobileSelectedHint" style="display:none"></div>
  <div class="teacher-list teacher-list-mobile" id="mobileTeacherList"></div>
</div>


<div class="toast-container" id="toastContainer"></div>

<script src="js/i18n.js?v=101"></script>
<script src="js/auth.js?v=101"></script>
<script src="js/nav.js?v=101"></script>
<script src="js/planner.js?v=108"></script>
<script>
  // initPlanner() (defined in planner.js) calls guardPage() + loads data.
  // initNav() is called after I18N loads so tab labels are translated.
  I18N.load(localStorage.getItem('firduty_lang') || 'ar').then(() => {
    initNav();
  });
</script>
</body>
</html>
