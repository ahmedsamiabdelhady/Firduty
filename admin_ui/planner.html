<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Week Planner</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <style>
    .planner-busy-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(2px);
    }
    .planner-busy-card {
      width: min(420px, calc(100vw - 32px));
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
      text-align: center;
    }
    .planner-progress-track {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }
    .planner-progress-bar {
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #22c55e);
      border-radius: 999px;
      animation: planner-indeterminate 1.2s ease-in-out infinite;
    }
    @keyframes planner-indeterminate {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    .shift-time-edit-btn {
      border: none;
      background: #ffffff;
      color: #2563eb;
      border-radius: 999px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      margin-inline-start: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      flex: 0 0 auto;
    }
    .break-grid-wrapper {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    }
    .break-grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      color: #5b21b6;
      font-size: 0.95rem;
      flex-wrap: wrap;
    }
    .break-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .break-grid-item {
      min-height: 96px;
      border: 1px dashed #c4b5fd;
      border-radius: 12px;
      padding: 10px;
      background: #faf5ff;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: flex-start;
    }
    .grade-pill {
      display: inline-flex;
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ede9fe;
      color: #6d28d9;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .break-slot-item .teacher-card {
      margin-top: 0;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1 data-i18n="app_title">Firduty</h1>
  <div class="header-actions">
    <button class="btn btn-lang btn-sm" onclick="I18N.toggle().then(()=>location.reload())">عربي | EN</button>
    <button class="btn btn-lang btn-sm" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<main class="main-content">

  <!-- Navigation -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    <a href="dashboard.html" class="btn btn-secondary btn-sm" data-i18n="dashboard">Dashboard</a>
    <a href="planner.html" class="btn btn-primary btn-sm" data-i18n="week_planner">Week Planner</a>
    <a href="reports.html" class="btn btn-secondary btn-sm" data-i18n="monthly_report">Report</a>
  </div>

  <!-- Week Controls -->
  <div class="week-controls">
    <label data-i18n="select_week">Select Week:</label>
    <input type="date" id="weekStartInput" onchange="onWeekSelected()" aria-label="Week start date">
    <button class="btn btn-primary btn-sm" onclick="loadWeek()" data-i18n="load_week">Load</button>

    <span id="weekStatusBadge" class="week-status-badge" style="display:none"></span>
    <span id="weekVersionBadge" style="font-size:0.8rem;color:#6c757d"></span>

    <div style="margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="createWeek()" data-i18n="create_week">Create Week</button>
      <button class="btn btn-secondary btn-sm" onclick="cloneWeek()" data-i18n="clone_last_week">Clone</button>
      <button class="btn btn-warning btn-sm" onclick="saveDraft()" data-i18n="save_draft">Save Draft</button>
      <button class="btn btn-success btn-sm" onclick="publishWeek()" data-i18n="publish_week">Publish</button>
    </div>
  </div>

  <!-- Planner Layout -->
  <div class="planner-layout">

    <aside class="sidebar">
      <h3 data-i18n="teachers">Teachers</h3>

      <div id="teachersLoading" style="text-align:center;padding:24px">
        <div class="spinner"></div>
      </div>

      <div class="teacher-list" id="teacherList"></div>
    </aside>

    <div class="planner-main">
      <div id="plannerLoading" style="text-align:center;padding:32px">
        <div class="spinner"></div>
      </div>

      <div class="tabs" id="dayTabs"></div>

      <div id="dayPanels">
        <p
          style="color:#6c757d;text-align:center;margin-top:40px;display:none"
          id="noPlanMsg"
          data-i18n="no_week"
        >
          No plan found for this week.
        </p>
      </div>
    </div>

  </div>
</main>

<div class="planner-busy-overlay" id="plannerBusyOverlay">
  <div class="planner-busy-card">
    <div class="spinner" style="margin:0 auto 14px"></div>
    <div id="plannerBusyText">Working...</div>
    <div class="planner-progress-track">
      <div class="planner-progress-bar"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/i18n.js?v=4"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/planner.js?v=4"></script>
</body>
</html>
