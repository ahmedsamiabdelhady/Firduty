<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Shift Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon"    href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">

  <style>
    /* ── Shift cards ─────────────────────────────────────────────────────── */
    .shifts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .shift-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .shift-card:hover { box-shadow: var(--shadow-md); }

    .shift-card-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .shift-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--nav);
    }
    .shift-type-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 10px;
    }
    .shift-type-morning   { background: #dbeafe; color: #1d4ed8; }
    .shift-type-break     { background: #ede9fe; color: #5b21b6; }

    .shift-card-body { padding: 14px 16px; }

    /* Inline edit form inside the card */
    .shift-edit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .shift-edit-label {
      width: 110px;
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .shift-edit-input {
      flex: 1;
      padding: 6px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--white);
    }
    .shift-edit-input:focus {
      outline: none;
      border-color: var(--nav-light);
      box-shadow: 0 0 0 2px rgba(79,161,204,0.15);
    }
    .shift-time-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .shift-time-row label {
      width: 110px;
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .shift-time-input {
      flex: 1;
      padding: 6px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--white);
    }
    .shift-time-input:focus {
      outline: none;
      border-color: var(--nav-light);
      box-shadow: 0 0 0 2px rgba(79,161,204,0.15);
    }

    .shift-card-actions {
      padding: 10px 16px 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
    }

    /* Validation error */
    .shift-error {
      font-size: 0.78rem;
      color: var(--danger);
      margin-top: -6px;
      margin-bottom: 6px;
      padding: 0 0 0 118px;
    }

    /* Loading skeleton */
    .shifts-loading { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .shifts-loading .spinner { margin: 0 auto 16px; }

    /* Add shift modal */
    .modal-form-row { margin-bottom: 14px; }
    .modal-form-row label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

<!-- Instant auth guard -->
<script>
  if (!localStorage.getItem('firduty_token')) {
    window.location.replace('login.html');
  }
</script>

<!-- ── Header ───────────────────────────────────────────────────────────────── -->
<header class="app-header">
  <h1>
    <img src="logo.png" alt="Firduty" width="32" height="32">
    <span data-i18n="app_title">Firduty</span>
  </h1>
  <div class="header-actions">
    <button class="btn btn-lang btn-sm"
            onclick="I18N.toggle().then(()=>location.reload())">عربي | EN</button>
    <button class="btn btn-lang btn-sm" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<!-- ── Main ─────────────────────────────────────────────────────────────────── -->
<main class="main-content">

  <!-- Navigation -->
  <nav class="nav-bar">
    <a class="nav-btn"        href="dashboard.html"  data-i18n="dashboard">Dashboard</a>
    <a class="nav-btn"        href="planner.html"    data-i18n="week_planner">Week Planner</a>
    <a class="nav-btn"        href="reports.html"    data-i18n="monthly_report">Monthly Report</a>
    <a class="nav-btn"        href="teachers.html"   data-i18n="teacher_approval">Teachers</a>
    <a class="nav-btn active" href="shifts.html"     data-i18n="shift_management">Shifts</a>
  </nav>

  <!-- Page header -->
  <div style="display:flex;align-items:center;justify-content:space-between;
              flex-wrap:wrap;gap:12px;margin-bottom:20px">
    <div>
      <h2 style="font-size:1.1rem;font-weight:700;color:var(--nav)" data-i18n="shift_management">
        Shift Management
      </h2>
      <p style="font-size:0.82rem;color:var(--text-muted)" data-i18n="shift_management_desc">
        Edit duty shift names and times.
      </p>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openAddModal()">
      + <span data-i18n="add_teacher">Add Shift</span>
    </button>
  </div>

  <!-- Shifts grid -->
  <div id="shiftsLoading" class="shifts-loading">
    <div class="spinner"></div>
    <p data-i18n="loading">Loading…</p>
  </div>

  <div id="shiftsGrid" class="shifts-grid" style="display:none"></div>

  <p id="shiftsEmpty" style="display:none;text-align:center;color:var(--text-muted);padding:60px 20px"
     data-i18n="no_shifts">No shifts found. Create shifts to get started.</p>

</main>

<!-- ── Add Shift Modal ───────────────────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="addModal">
  <div class="modal" style="max-width:480px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="font-size:1rem;font-weight:700;color:var(--nav)" data-i18n="add_teacher">Add Shift</h3>
      <button class="btn-icon" onclick="closeAddModal()">✕</button>
    </div>

    <div class="modal-form-row">
      <label data-i18n="name_en">Name (English)</label>
      <input class="shift-edit-input" id="add-name-en" type="text" placeholder="e.g. Morning Duty">
    </div>
    <div class="modal-form-row">
      <label data-i18n="name_ar">Name (Arabic)</label>
      <input class="shift-edit-input" id="add-name-ar" type="text" placeholder="مثال: المناوبة الصباحية" dir="rtl">
    </div>
    <div class="modal-form-row">
      <label data-i18n="start_time">Start Time</label>
      <input class="shift-edit-input" id="add-start-time" type="time">
    </div>
    <div class="modal-form-row">
      <label data-i18n="end_time">End Time</label>
      <input class="shift-edit-input" id="add-end-time" type="time">
    </div>
    <div class="modal-form-row">
      <label data-i18n="duty_type">Duty Type</label>
      <select class="shift-edit-input" id="add-duty-type">
        <option value="morning_endofday" data-i18n="morning_endofday">Morning / End-of-day</option>
        <option value="break" data-i18n="break_duty">Break Duty</option>
      </select>
    </div>
    <div class="modal-form-row">
      <label data-i18n="order">Display Order</label>
      <input class="shift-edit-input" id="add-order" type="number" min="0" value="0">
    </div>

    <p id="addError" class="shift-error" style="display:none;padding:0"></p>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-secondary btn-sm" onclick="closeAddModal()" data-i18n="cancel">Cancel</button>
      <button class="btn btn-primary btn-sm"  onclick="addShift()"    data-i18n="save">Save</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- Script order: i18n → auth → shifts -->
<script src="js/i18n.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/shifts.js?v=1"></script>
</body>
</html>
