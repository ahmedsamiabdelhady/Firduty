<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Dashboard</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1><img src="logo.png" alt="Firduty" class="header-logo">Firduty</h1>
  <div class="header-actions">
    <button class="btn btn-icon" title="Refresh" onclick="loadDashboard()" style="color:var(--white);font-size:1.1rem;padding:4px 10px">↺</button>
    <button class="btn btn-lang btn-sm" onclick="I18N.toggle().then(()=>location.reload())">عربي | EN</button>
    <button class="btn btn-lang btn-sm" onclick="logout()" data-i18n="logout">Logout</button>
  </div>
</header>

<nav class="main-nav" id="mainNav" aria-label="Main navigation"></nav>

<main class="main-content">
  <div id="dashContent"></div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script src="js/auth.js?v=101"></script>
<script src="js/i18n.js?v=101"></script>
<script src="js/nav.js?v=101"></script>
<script src="js/dashboard.js?v=101"></script>
<script>
  if (!localStorage.getItem('firduty_token')) { window.location.href = 'login.html'; }
  I18N.load(localStorage.getItem('firduty_lang') || 'ar').then(() => {
    initNav();
    loadDashboard();
  });
</script>
</body>
</html>
