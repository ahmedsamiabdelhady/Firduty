<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firduty — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon"    href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png">

  
  <style>
    /* ── Dashboard page-specific styles — optimized v4.0 ─────────────────── */
    .main-content {
      max-width: 1520px;
    }

    .nav-bar {
      position: sticky;
      top: 68px;
      z-index: 30;
      backdrop-filter: blur(10px);
      background: rgba(46,125,167,0.96);
      box-shadow: 0 10px 24px rgba(46,125,167,0.16);
    }

    .dash-shell {
      display: grid;
      gap: 18px;
    }

    .dash-panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98));
      border: 1px solid rgba(214,221,232,0.9);
      border-radius: 20px;
      box-shadow: 0 12px 34px rgba(31,45,58,0.08);
      overflow: hidden;
    }

    .dash-hero {
      display: grid;
      grid-template-columns: 1.45fr .95fr;
      gap: 16px;
      align-items: stretch;
    }

    .dash-hero-main {
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(46,125,167,0.98), rgba(79,161,204,0.94) 55%, rgba(127,179,63,0.94));
      color: var(--white);
      position: relative;
      overflow: hidden;
      min-height: 250px;
    }
    .dash-hero-main::before,
    .dash-hero-main::after {
      content: '';
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      pointer-events: none;
    }
    .dash-hero-main::before {
      width: 220px; height: 220px; right: -70px; top: -90px;
    }
    .dash-hero-main::after {
      width: 160px; height: 160px; left: -40px; bottom: -70px;
    }
    .dash-hero-main > * { position: relative; z-index: 1; }
    .dash-hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .dash-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.24);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .dash-hero-title {
      font-size: clamp(1.45rem, 2.3vw, 2.05rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .dash-hero-subtitle {
      font-size: .95rem;
      color: rgba(255,255,255,.9);
      max-width: 760px;
    }
    .dash-hero-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .dash-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 0.78rem;
      font-weight: 700;
    }
    .dash-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 20px;
      max-width: 620px;
    }
    .dash-action {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      color: var(--white);
      text-decoration: none;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      min-height: 52px;
    }
    .dash-action:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.18);
      box-shadow: 0 14px 22px rgba(0,0,0,0.12);
    }
    .dash-action__icon {
      width: 34px; height: 34px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.16); flex-shrink: 0;
      font-size: 1rem;
    }
    .dash-action__txt { display: flex; flex-direction: column; gap: 2px; }
    .dash-action__title { font-size: .86rem; font-weight: 700; }
    .dash-action__meta { font-size: .74rem; color: rgba(255,255,255,0.82); }

    .dash-hero-side {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dash-health-card {
      border-radius: 16px;
      padding: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid rgba(214,221,232,0.9);
    }
    .dash-health-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .dash-health-title {
      font-size: .92rem;
      font-weight: 800;
      color: var(--nav);
    }
    .dash-health-sub {
      font-size: .77rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .dash-score {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 900;
      color: var(--nav);
      background: rgba(46,125,167,0.08);
    }
    .dash-health-meter {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: #e8eef5;
      margin-bottom: 10px;
    }
    .dash-health-meter > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      transition: width .35s ease;
      background: linear-gradient(90deg, var(--nav), var(--primary));
    }
    .dash-health-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .dash-health-metric {
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--bg);
      border: 1px solid rgba(214,221,232,0.8);
    }
    .dash-health-metric strong {
      display: block;
      font-size: 1rem;
      color: var(--text);
      margin-bottom: 4px;
    }
    .dash-health-metric span {
      font-size: .73rem;
      color: var(--text-muted);
    }

    .dash-priority-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .priority-card {
      position: relative;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(214,221,232,.95);
      background: linear-gradient(180deg, #fff 0%, #f9fbfd 100%);
      box-shadow: 0 10px 24px rgba(31,45,58,0.06);
      min-height: 150px;
    }
    .priority-card__top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }
    .priority-card__icon {
      width: 40px; height: 40px; border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
      background: rgba(46,125,167,0.08); color: var(--nav);
    }
    .priority-card[data-tone='warning'] .priority-card__icon { background: rgba(245,166,35,0.14); color: #c17a00; }
    .priority-card[data-tone='danger']  .priority-card__icon { background: rgba(224,82,82,0.14); color: var(--danger); }
    .priority-card[data-tone='success'] .priority-card__icon { background: rgba(127,179,63,0.14); color: var(--success-dark); }
    .priority-card__badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 34px; height: 34px; padding: 0 12px;
      border-radius: 999px; font-size: .9rem; font-weight: 900;
      background: rgba(31,45,58,.06); color: var(--text);
    }
    .priority-card h3 {
      font-size: 1rem; font-weight: 800; color: var(--text); margin-bottom: 6px;
    }
    .priority-card p {
      font-size: .82rem; color: var(--text-muted); line-height: 1.6;
    }
    .priority-card__meta {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .priority-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 999px;
      font-size: .74rem; font-weight: 700;
      background: var(--bg); color: var(--text-muted);
      border: 1px solid rgba(214,221,232,.8);
    }

    .dash-section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .dash-section-title h2 {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--nav);
    }
    .dash-section-caption {
      font-size: .8rem;
      color: var(--text-muted);
    }

    .dash-stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .dash-stat-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98));
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(31,45,58,0.06);
      border: 1px solid rgba(214,221,232,0.9);
      transition: transform .18s ease, box-shadow .18s ease;
      position: relative;
      overflow: hidden;
      min-height: 132px;
      text-align: start;
    }
    .dash-stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(31,45,58,0.09);
    }
    .dash-stat-card::after {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 90px;
      height: 90px;
      border-radius: 999px;
      background: rgba(46,125,167,0.06);
      pointer-events: none;
    }
    .dash-stat-card.green::after  { background: rgba(127,179,63,0.12); }
    .dash-stat-card.orange::after { background: rgba(245,166,35,0.12); }
    .dash-stat-card.red::after    { background: rgba(224,82,82,0.12); }
    .dash-stat-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .dash-stat-icon {
      width: 38px; height: 38px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1rem; background: rgba(46,125,167,0.08); color: var(--nav);
    }
    .dash-stat-card.green .dash-stat-icon  { background: rgba(127,179,63,0.14); color: var(--success-dark); }
    .dash-stat-card.orange .dash-stat-icon { background: rgba(245,166,35,0.16); color: #c17a00; }
    .dash-stat-card.red .dash-stat-icon    { background: rgba(224,82,82,0.14); color: var(--danger); }
    .dash-stat-value {
      font-size: clamp(1.7rem, 2vw, 2.1rem);
      font-weight: 900;
      color: var(--nav);
      line-height: 1;
      position: relative;
      z-index: 1;
    }
    .dash-stat-card.green  .dash-stat-value { color: var(--success-dark); }
    .dash-stat-card.orange .dash-stat-value { color: #c17a00; }
    .dash-stat-card.red    .dash-stat-value { color: var(--danger); }
    .dash-stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 7px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }
    .dash-stat-trend {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .73rem;
      font-weight: 800;
      background: var(--bg);
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }

    .section-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98));
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 26px rgba(31,45,58,0.06);
      margin-bottom: 0;
      border: 1px solid rgba(214,221,232,.92);
    }
    .section-card h3 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--nav);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(214,221,232,.85);
    }
    .section-card h3 small,
    .section-card h3 span {
      font-size: .78rem;
    }

    .dash-refresh-btn {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      color: var(--white);
      border-radius: 12px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 1rem;
      transition: background .15s ease, transform .15s ease;
    }
    .dash-refresh-btn:hover { background: rgba(255,255,255,0.24); transform: translateY(-1px); }
    .dash-refresh-btn.spinning { animation: spin .75s linear infinite; }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .warn-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .warn-list li {
      padding: 12px 14px;
      background: #fffaf0;
      border-inline-start: 4px solid var(--warning);
      border-radius: 14px;
      font-size: 0.85rem;
      color: #7a4f00;
      line-height: 1.5;
    }
    [dir='rtl'] .warn-list li { border-inline-start: none; border-inline-end: 4px solid var(--warning); }

    .mini-stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .mini-stat {
      background: var(--bg);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid rgba(214,221,232,0.9);
      min-height: 86px;
    }
    .mini-stat-value { font-size: 1.55rem; font-weight: 900; color: var(--nav); }
    .mini-stat-value.red { color: var(--danger); }
    .mini-stat-value.green { color: var(--success-dark); }
    .mini-stat-value.orange { color: #c17a00; }
    .mini-stat-label { font-size: 0.74rem; color: var(--text-muted); margin-top: 4px; font-weight: 700; }

    .today-grid {
      display: grid;
      grid-template-columns: 120px 140px 1fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .today-ring-wrap {
      display: flex; flex-direction: column; align-items: center;
      background: var(--bg); border: 1px solid rgba(214,221,232,.85);
      padding: 12px; border-radius: 16px; min-height: 132px;
    }
    .today-ring-label { font-size: .74rem; color: var(--text-muted); margin-top: 8px; font-weight: 700; }
    .today-slot-counts { display: grid; gap: 10px; }
    .today-slot-row {
      display: flex; flex-direction: column; gap: 2px;
      background: var(--bg); border: 1px solid rgba(214,221,232,.85);
      border-radius: 14px; padding: 12px; min-height: 76px;
    }
    .today-slot-num { font-size: 1.5rem; font-weight: 900; line-height: 1; }
    .today-slot-lbl { font-size: .73rem; color: var(--text-muted); font-weight: 700; }
    .today-teachers { min-width: 0; }
    .today-teachers-label {
      font-size: .78rem; font-weight: 800; color: var(--text-muted);
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .today-teachers-label.warn { color: var(--danger); }
    .today-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .td-chip {
      display: inline-flex; align-items: center;
      padding: 5px 10px; border-radius: 999px;
      font-size: .76rem; font-weight: 800;
      border: 1px solid transparent;
    }
    .td-chip--on  { background: #dcfce7; color: #166534; border-color: rgba(22,101,52,0.1); }
    .td-chip--off { background: #fee2e2; color: #991b1b; border-color: rgba(153,27,27,0.1); }
    .td-chip--ok  { background: #dcfce7; color: #166534; border-color: rgba(22,101,52,0.1); }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(110px, 160px) 1fr 34px;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .bar-label {
      text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text-muted); font-size: 0.82rem; font-weight: 700;
    }
    .bar-track {
      background: #edf1f5; border-radius: 999px; height: 12px; min-width: 60px; overflow: hidden;
    }
    .bar-fill { height: 12px; border-radius: 999px; background: var(--primary); transition: width 0.45s ease; }
    .bar-fill.break-type { background: #7c3aed; }
    .bar-count { width: 34px; text-align: end; font-weight: 800; color: var(--text); font-size: 0.84rem; }

    .wl-badge {
      font-size: 0.72rem; font-weight: 800; padding: 4px 9px; border-radius: 999px; margin-inline-start: 8px;
    }
    .wl-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .wl-pill {
      background: var(--bg); border: 1px solid rgba(214,221,232,.9); border-radius: 16px;
      padding: 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .wl-pill-icon { font-size: 1.15rem; }
    .wl-pill-name { font-weight: 800; font-size: 0.86rem; color: var(--text); }
    .wl-pill-val { font-size: 0.84rem; font-weight: 800; }
    .wl-pill-tag { font-size: 0.74rem; color: var(--text-muted); }

    .conf-layout { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; margin-bottom: 8px; }
    .conf-ring-wrap { text-align: center; }
    .conf-breakdown { min-width: 0; }
    .conf-bar-row { display: grid; grid-template-columns: 145px 1fr 32px 40px; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.82rem; }
    .conf-bar-label { color: var(--text-muted); font-size: 0.78rem; font-weight: 700; }
    .conf-bar-track { height: 10px; background: #edf1f5; border-radius: 999px; overflow: hidden; min-width: 60px; }
    .conf-bar-fill { height: 10px; border-radius: 999px; transition: width .45s ease; }
    .conf-bar-num { text-align: end; font-weight: 800; font-size: 0.82rem; }
    .conf-bar-num.green { color: var(--primary); }
    .conf-bar-num.orange { color: #c17a00; }
    .conf-bar-num.red { color: var(--danger); }
    .conf-bar-pct { text-align: end; color: var(--text-muted); font-size: 0.75rem; }
    /* pill + status-pill defined globally in style.css */
    .no-duty-chip {
      display: inline-flex; align-items: center; background: #fee2e2; color: #b91c1c;
      border-radius: 999px; padding: 6px 11px; font-size: .78rem; margin: 4px 4px 0 0; font-weight: 800;
    }
    .teacher-mini-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .teacher-mini-table th {
      text-align: start; padding: 8px 10px; color: var(--text-muted); font-weight: 700; font-size: 0.75rem;
      border-bottom: 1px solid rgba(214,221,232,.9);
    }
    .teacher-mini-table td { padding: 9px 10px; border-bottom: 1px solid #f2f5f8; }
    .teacher-mini-table tr:last-child td { border-bottom: none; }

    .dash-loading,
    .dash-error {
      text-align: center; padding: 84px 20px; color: var(--text-muted);
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.98));
      border-radius: 22px; box-shadow: 0 12px 34px rgba(31,45,58,0.08);
      border: 1px solid rgba(214,221,232,.9);
    }
    .dash-loading .spinner { margin: 0 auto 16px; }
    .dash-loading p,
    .dash-error p { font-size: 0.92rem; }
    .dash-error .error-icon { font-size: 2.5rem; margin-bottom: 12px; }

    @media (max-width: 1200px) {
      .dash-hero,
      .dash-priority-grid,
      .dash-stat-grid,
      .mini-stat-grid,
      .wl-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .today-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 920px) {
      .nav-bar { position: static; }
      .two-col,
      .dash-hero,
      .dash-priority-grid,
      .dash-stat-grid,
      .mini-stat-grid,
      .wl-summary,
      .today-grid,
      .conf-layout { grid-template-columns: 1fr; }
      .conf-bar-row { grid-template-columns: 1fr; gap: 6px; }
      .bar-row { grid-template-columns: 1fr; }
      .dash-actions { grid-template-columns: 1fr; }
      .dash-health-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .main-content { padding: 16px 12px 28px; }
      .dash-hero-main,
      .dash-hero-side,
      .section-card,
      .priority-card { padding: 16px; }
      .dash-health-grid { grid-template-columns: 1fr; }
    }
  </style>

</head>
<body>

<!-- Instant auth guard — redirect before any rendering -->
<script>
  if (!localStorage.getItem('firduty_token')) {
    window.location.replace('login.html');
  }
</script>

<!-- ── Header ───────────────────────────────────────────────────────────────── -->
<header class="app-header">
  <h1>
    <img src="logo.png" alt="Firduty" width="32" height="32">
    <span data-i18n="app_title">Firduty</span>
  </h1>
  <div class="header-actions">
