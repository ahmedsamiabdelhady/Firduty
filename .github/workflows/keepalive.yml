# .github/workflows/keepalive.yml
#
# Pings the backend /health endpoint every 5 minutes to prevent Koyeb
# from sleeping the service on the free tier.
#
# ── REQUIRED SETUP ────────────────────────────────────────────────────────────
# 1. Go to your GitHub repository → Settings → Secrets and variables → Actions.
# 2. Create a new repository secret named: KOYEB_APP_URL
# 3. Set its value to your full Koyeb deployment URL with NO trailing slash, e.g.:
#      https://naval-donnamarie-firduty-6e288803.koyeb.app
#
# Using a secret keeps the URL out of the workflow file and lets you update it
# without touching this file.
# ─────────────────────────────────────────────────────────────────────────────

name: Keep API Alive

on:
  schedule:
    # Every 5 minutes — keeps Koyeb free-tier service from sleeping.
    # GitHub Actions cron minimum resolution is 1 minute; 5 min is reliable.
    -   cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI for testing.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ secrets.KOYEB_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "ERROR: KOYEB_APP_URL secret is not set."
            exit 1
          fi

          for i in 1 2 3; do
            echo "Ping #$i at $(date -u)"
            curl \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time 30 \
              --fail \
              -L \
              -s \
              -o /dev/null \
              -w "HTTP %{http_code} — total time: %{time_total}s\n" \
              "${APP_URL}/health"

            sleep 20
          done