name: firduty
description: Firduty Teacher Duty Roster App — Android native + Web PWA (iOS Safari)
publish_to: 'none'
version: 2.3.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  http: ^1.2.1
  shared_preferences: ^2.2.3

  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  firebase_messaging_web: ^4.1.3

  flutter_local_notifications: ^21.0.0

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#2E7DA7"
  adaptive_icon_foreground: assets/app_icon.png

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/logo.png
    - assets/logo_small.png
    - assets/app_icon.png