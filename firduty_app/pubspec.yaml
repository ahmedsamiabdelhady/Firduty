name: firduty
description: Firduty Teacher Duty Roster App — Android native + Web PWA (iOS Safari)
publish_to: 'none'
version: 2.3.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localizations (SDK flutter package — required for delegates)
  flutter_localizations:
    sdk: flutter

  # HTTP
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.2.3

  # Firebase — supports Android (native) and Web (FCM web push / iOS Safari PWA)
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10

  # Local notification display — Android only.
  # Guarded with kIsWeb in notification_service.dart (not invoked on web).
  flutter_local_notifications: ^21.0.0

  # Internationalisation utilities (DateFormat etc.)
  # Must be ^0.20.2 — flutter_localizations (SDK) pins intl to 0.20.2.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Enables automatic `flutter gen-l10n` during build.
  # Config is in l10n.yaml (project root).
  generate: true

  assets:
    - assets/logo.png
    - assets/logo_small.png